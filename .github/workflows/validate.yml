name: Validate Nixus
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b
        with:
          extra_nix_config: system-features = nixos-test benchmark big-parallel kvm
      - name: Check release tag version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: test "$RELEASE_TAG" = "v$(cat VERSION)"
      - name: Go formatting, vet and unit tests
        run: |
          nix develop -c bash -c 'test -z "$(gofmt -l cmd)" && go vet ./... && go test ./...'
      - name: Fetch the pinned upstream health controller fixture
        run: nix build .#checks.x86_64-linux.healthd-image --no-link -L
      - name: Build Go runtime and run its packaged tests
        run: nix build .#packages.x86_64-linux.nixus --no-link -L
      - name: Validate UI JavaScript
        run: |
          for file in admin/static/*.js; do node --check "$file"; done
          for test in tests/*.js; do node "$test"; done
      - name: Parse all Nix files
        run: find . -name '*.nix' -print0 | xargs -0 -r -n1 nix-instantiate --parse >/dev/null
      - name: Verify pure settings, project, secret and management contracts
        run: |
          for checks in nixusMigrationChecks nixusGuestSecretsChecks nixusProjectValidationChecks nixusFoundationChecks nixusSecretsChecks nixusManagementChecks; do
            nix eval --json ".#$checks" | jq -e 'length > 0 and all(.[]; . == true)'
          done
          nix-instantiate --eval --strict --json site.nix | jq -e '.schemaVersion == 3'
          nix eval --json .#nixusProjectChecks | jq -e '
            .schemaVersion == 1 and (.projects | keys) == ["alpha", "beta"]
            and .projects.alpha.backend == "incus-compose" and .projects.alpha.resources.cpus == 3
            and .projects.alpha.secrets.file == "secrets.enc.yaml"
            and .projects.alpha.secrets.bindings.API_TOKEN.destination == "/run/secrets/API_TOKEN"
            and .projects.alpha.modules == ["modules/nested/resources.nix", "modules/network.nix"]
            and .projects.beta.backup.consistency == "quiesce"'
      - name: Verify defaults
        run: |
          diff <(nix eval --json .#nixusDefaults | jq -S .) <(jq -S . tests/fixtures/defaults.json)
          test "$(nix eval --json .#nixosConfigurations.validation-minimal.config.services.prometheus.enable)" = "false"
          test "$(nix eval --json .#nixosConfigurations.validation-minimal.config.services.nginx.enable)" = "false"
          test "$(nix eval --json .#nixosConfigurations.validation-minimal.config.virtualisation.docker.enable)" = "false"
          test "$(nix eval --json .#nixosConfigurations.validation-services.config.services.prometheus.enable)" = "true"
      - name: Evaluate configuration variants
        run: |
          for target in validation-minimal validation-file-disk validation-notifications validation-host validation-ethernet validation-ethernet-nm validation-ethernet-wifi validation-services validation-zfs validation-inherited validation-bootstrap validation-setup validation-management validation-sops; do
            nix eval ".#nixosConfigurations.$target.config.system.build.toplevel.drvPath"
          done
      - name: Build packages, launchers and service units
        run: |
          nix build .#packages.x86_64-linux.admin .#packages.x86_64-linux.installer .#packages.x86_64-linux.homelab --no-link
          nix run .#update -- --help
          nix build '.#nixosConfigurations.validation-services.config.systemd.units."nixus-metrics.service".unit' --no-link
          nix build '.#nixosConfigurations.validation-notifications.config.systemd.units."nixus-notify@.service".unit' --no-link
          nix build '.#nixosConfigurations.validation-setup.config.systemd.units."nixus-ui.service".unit' --no-link
  integration:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: portal
            target: .#checks.x86_64-linux.portal
          - name: networking
            target: .#checks.x86_64-linux.networking
          - name: oci-and-cold-restore
            target: .#checks.x86_64-linux.oci
          - name: host
            target: .#nixosConfigurations.validation-host.config.system.build.toplevel
    name: integration (${{ matrix.name }})
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b
        with:
          extra_nix_config: system-features = nixos-test benchmark big-parallel kvm
      - name: Enable KVM for VM tests
        if: matrix.name != 'host'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Run integration target
        env:
          NIXUS_CHECK_TARGET: ${{ matrix.target }}
        run: nix build "$NIXUS_CHECK_TARGET" --no-link -L
  validate:
    if: always()
    needs: [source, integration]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all source and integration checks
        env:
          SOURCE_RESULT: ${{ needs.source.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        run: |
          test "$SOURCE_RESULT" = success
          test "$INTEGRATION_RESULT" = success
