name: Website
on:
  push:
    branches: [main]
    paths: ['website/**', 'docs/**', 'cmd/website/**', 'go.mod', 'go.sum', 'admin/static/brand.css', 'admin/static/favicon.svg', 'admin/static/fonts/**', '.github/workflows/pages.yml']
  pull_request:
    paths: ['website/**', 'docs/**', 'cmd/website/**', 'go.mod', 'go.sum', 'admin/static/brand.css', 'admin/static/favicon.svg', 'admin/static/fonts/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b
      - name: Build and validate custom-domain site
        run: nix develop -c go run ./cmd/website --base-path '' --check
      - name: Validate project-site paths too
        run: nix develop -c go run ./cmd/website --base-path /nixus --output /tmp/nixus-project-site --check
      - name: Check browser JavaScript
        run: node --check website/assets/site.js
      - name: Upload validated site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
