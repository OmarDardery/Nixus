name: Portal entry acceptance
on:
  push:
    branches: [main]
    paths:
      - 'admin/static/**'
      - 'cmd/nixus/diagnostics.go'
      - 'modules/admin-ui.nix'
      - 'tests/test_homepage.js'
      - 'tests/test_commands_ui.js'
      - '.github/workflows/portal-entry.yml'
  pull_request:
    paths:
      - 'admin/static/**'
      - 'cmd/nixus/diagnostics.go'
      - 'modules/admin-ui.nix'
      - 'tests/test_homepage.js'
      - 'tests/test_commands_ui.js'
      - '.github/workflows/portal-entry.yml'
  workflow_dispatch:
permissions:
  contents: read
# Same-repository PRs already validate feature branches. Do not run the same
# expensive NixOS suite a second time for their branch push.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  portal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b
      - name: Portal links, navigation and copy-only commands
        run: |
          node --check admin/static/app.js
          node --check admin/static/commands.js
          node tests/test_homepage.js
          node tests/test_commands_ui.js
      - name: Evaluate port 80 redirect on the actual setup configuration
        run: |
          eval_json() { nix eval --json ".#nixosConfigurations.validation-setup.config.$1"; }
          test "$(eval_json nixus.settings.setup.enable)" = true
          test "$(eval_json services.nginx.enable)" = true
          eval_json services.nginx.virtualHosts.nixus-entry.listen | jq -e 'any(.[]; .port == 80 and (.ssl // false) == false)'
          test "$(eval_json 'services.nginx.virtualHosts.nixus-entry.locations."/".return')" = '"308 https://$host:9440$request_uri"'
          test "$(eval_json services.nginx.virtualHosts.nixus-entry.default)" = true
